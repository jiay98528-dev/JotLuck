name: 功能建议 / Feature request
description: 描述一个真实使用场景和希望改善的结果
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        JotLuck 坚持本地优先、纯文本和轻量设计。请先描述问题，再描述你想到的功能。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到问题？这个问题多久发生一次？
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 当前解决方式
      description: 你现在如何完成这件事？哪些地方最费时间或最不可靠？
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: 描述成功后的体验，不需要限定具体实现。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 可选方案
      description: 如果你已有具体想法，可以在这里补充。

  - type: checkboxes
    id: principles
    attributes:
      label: 产品原则
      options:
        - label: 该建议可以保持笔记为普通本地文件。
          required: true
        - label: 我已搜索现有 Issues，没有发现相同建议。
          required: true
