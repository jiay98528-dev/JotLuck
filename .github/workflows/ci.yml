name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_rc_gate:
        description: 'Run the strict installed-app RC gate (Public V2S stop still returns code 10)'
        required: true
        default: false
        type: boolean
      run_preview_gate:
        description: 'Run the v0.1.0-preview installed-app evidence v2 gate'
        required: true
        default: false
        type: boolean
      release_id:
        description: 'release-evidence/installed-app/v2/<release-id> directory name'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit:js:prod

      - name: Audit all JavaScript dependencies
        run: pnpm audit:js:all

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Token contract check
        run: pnpm lint:tokens

      - name: Format check
        run: pnpm format

      - name: Stylelint
        run: pnpm --filter @jotluck/app lint:style

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify V2S evidence or its fail-closed absence
        run: node scripts/verify-autocomplete-v2s-evidence.mjs --mode=ci

      - name: Run unit tests
        run: pnpm test

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/app
          if-no-files-found: ignore

      - name: Build app
        run: pnpm --filter @jotluck/app build

      - name: Verify frozen V1 is absent from the production bundle
        run: pnpm exec tsx scripts/autocomplete-v1-frozen-adapter.ts --check-production-isolation

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: pnpm --filter @jotluck/app exec playwright test --project=${{ matrix.browser }} --workers=1 --grep-invert @windows-visual

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            e2e/report
            packages/app/test-results
            e2e/artifacts
          if-no-files-found: ignore

  e2e-visual-windows:
    name: Windows Visual Regression
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run Win32-owned visual baselines
        run: pnpm --filter @jotluck/app exec playwright test 23-halo-canvas-theme.spec.ts --project=chromium --workers=1 --grep @windows-visual

      - name: Upload Windows visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-windows
          path: |
            e2e/report
            packages/app/test-results
            e2e/artifacts
          if-no-files-found: ignore

  rust:
    name: Rust Check, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust check
        run: cargo check --manifest-path packages/app/src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path packages/app/src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file packages/app/src-tauri/Cargo.lock

  tauri-build-windows:
    name: Windows Tauri Build
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test, rust]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer
        run: pnpm --filter @jotluck/app tauri:build

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install matching Microsoft Edge Driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $edgeDriver = (Resolve-Path ".\msedgedriver.exe").Path
          "JOTLUCK_EDGE_DRIVER=$edgeDriver" >> $env:GITHUB_ENV

      - name: Run standalone Tauri WebView2 smoke
        run: pnpm test:tauri:webview-smoke

      - name: Upload Tauri WebView2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-webview2-smoke
          path: scripts/corpus/_web-cache/autocomplete-candidates/tauri-webview-smoke.json
          if-no-files-found: error

      - name: Upload immutable Windows candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jotluck-windows-candidate
          path: |
            packages/app/dist/**
            packages/app/src-tauri/target/release/jotluck.exe
            packages/app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release-installed-app-gate:
    name: Installed-app Release Gate
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_rc_gate == true || inputs.run_preview_gate == true) }}
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, test, rust]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read immutable candidate artifact binding
        id: candidate
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_ID)) {
            throw 'release_id is required for an installed-app gate'
          }
          $manifestPath = "release-evidence/installed-app/v2/$env:RELEASE_ID/manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "evidence manifest not found: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          "run_id=$($manifest.ci.runId)" >> $env:GITHUB_OUTPUT
          "artifact_id=$($manifest.ci.artifactId)" >> $env:GITHUB_OUTPUT

      - name: Download exact candidate Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: candidate-installer

      - name: Resolve candidate installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'candidate-installer' -Recurse -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one candidate installer, found $($installers.Count)"
          }
          "JOTLUCK_INSTALLER_PATH=$($installers[0].FullName)" >> $env:GITHUB_ENV
          $bundles = @(Get-ChildItem -LiteralPath 'candidate-installer' -Recurse -Directory -Filter 'dist' | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'index.html') -PathType Leaf })
          if ($bundles.Count -ne 1) {
            throw "expected exactly one production dist directory, found $($bundles.Count)"
          }
          "JOTLUCK_PRODUCTION_BUNDLE_PATH=$($bundles[0].FullName)" >> $env:GITHUB_ENV

      - name: Run installed-app RC gate
        if: ${{ inputs.run_rc_gate == true }}
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/release-rc-gate.mjs "$env:RELEASE_ID"

      - name: Run v0.1.0-preview gate
        if: ${{ inputs.run_preview_gate == true }}
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/release/verify-preview-release-gate.mjs "$env:RELEASE_ID" "release-evidence/installed-app/v2/$env:RELEASE_ID/preview-gate.json" "$env:JOTLUCK_INSTALLER_PATH" "$env:JOTLUCK_PRODUCTION_BUNDLE_PATH"
