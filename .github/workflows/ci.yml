name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit:js:prod

      - name: Audit all JavaScript dependencies
        run: pnpm audit:js:all

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Token contract check
        run: pnpm lint:tokens

      - name: Format check
        run: pnpm format

      - name: Stylelint
        run: pnpm --filter @jotluck/app lint:style

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify V2S evidence or its fail-closed absence
        run: node scripts/verify-autocomplete-v2s-evidence.mjs --mode=ci

      - name: Run unit tests
        run: pnpm test

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/app
          if-no-files-found: ignore

      - name: Build app
        run: pnpm --filter @jotluck/app build

      - name: Verify frozen V1 is absent from the production bundle
        run: pnpm exec tsx scripts/autocomplete-v1-frozen-adapter.ts --check-production-isolation

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: pnpm --filter @jotluck/app exec playwright test --project=${{ matrix.browser }} --workers=1 --grep-invert @windows-visual

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            e2e/report
            packages/app/test-results
            e2e/artifacts
          if-no-files-found: ignore

  e2e-visual-windows:
    name: Windows Visual Regression
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run Win32-owned visual baselines
        run: pnpm --filter @jotluck/app exec playwright test 23-halo-canvas-theme.spec.ts --project=chromium --workers=1 --grep @windows-visual

      - name: Upload Windows visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-windows
          path: |
            e2e/report
            packages/app/test-results
            e2e/artifacts
          if-no-files-found: ignore

  rust:
    name: Rust Check, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust check
        run: cargo check --manifest-path packages/app/src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path packages/app/src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file packages/app/src-tauri/Cargo.lock

  tauri-build-windows:
    name: Windows Tauri Build
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test, rust]
    outputs:
      candidate-artifact-id: ${{ steps.candidate-upload.outputs.artifact-id }}
      candidate-artifact-digest: ${{ steps.candidate-upload.outputs.artifact-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer
        run: pnpm --filter @jotluck/app tauri:build

      - name: Install tauri-driver
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          $tauriDriver = (Resolve-Path "$env:USERPROFILE\.cargo\bin\tauri-driver.exe" -ErrorAction Stop).Path
          $tauriDriverVersion = & $tauriDriver --version
          if ($tauriDriverVersion -notmatch '(^|\s)2\.0\.6($|\s)') {
            throw "unexpected tauri-driver version: $tauriDriverVersion"
          }
          "JOTLUCK_TAURI_DRIVER=$tauriDriver" >> $env:GITHUB_ENV

      - name: Install matching Microsoft Edge Driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $edgeDriver = (Resolve-Path ".\msedgedriver.exe").Path
          "JOTLUCK_EDGE_DRIVER=$edgeDriver" >> $env:GITHUB_ENV

      - name: Run standalone Tauri WebView2 smoke
        run: pnpm test:tauri:webview-smoke

      - name: Upload Tauri WebView2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-webview2-smoke
          path: scripts/corpus/_web-cache/autocomplete-candidates/tauri-webview-smoke.json
          if-no-files-found: error

      - name: Upload immutable Windows candidate
        id: candidate-upload
        uses: actions/upload-artifact@v4
        with:
          name: jotluck-windows-candidate
          path: |
            packages/app/dist/**
            packages/app/src-tauri/target/release/jotluck.exe
            packages/app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
