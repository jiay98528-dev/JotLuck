[package]
name = "jotluck"
version = "0.3.2"
description = "JotLuck — local-first Markdown note-taking tool"
authors = ["Linghu Technology (Shenzhen) Co., Ltd."]
license = "MIT"
repository = "https://github.com/jiay98528-dev/JotLuck"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
log = "0.4"
# P7：全项目（Rust/前端）零托盘调用，不启用托盘图标 feature——
# 它还会让 deb 自动带上 libayatana-appindicator 装机依赖。
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

# M6-05: File watcher
notify = "8"

# M7: Recycle bin support
trash = "5"

# M6-06: Template rendering
chrono = "0.4"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rayon = "1.12.0"
docx-rs = { version = "0.4.22", default-features = false }
calamine = { version = "0.37", default-features = false, features = ["dates"] }
lopdf = { version = "0.44", default-features = false }
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# tauri mock runtime（tauri::test）：lib.rs 的 setup 主窗口降级等
# AppHandle 级单测用（P5）。仅测试构建启用 test feature，
# 不参与 release 构建，不影响 Windows 产物。
tauri = { version = "2.11.2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_Marshal",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
