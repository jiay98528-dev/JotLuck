packages:
  - 'packages/*'
  - 'tools/*'
allowBuilds:
  '@ibm/plex': true
  edgedriver: false
  esbuild: true
  geckodriver: false
  protobufjs: false
  vue-demi: true
minimumReleaseAgeExclude:
  - '@puppeteer/browsers@3.2.0'
  - nanoid@3.3.18
  - postcss@8.5.23
overrides:
  # GHSA-jmr9-qjv8-65gv：新版浏览器管理模块已移除受影响的 extract-zip 依赖
  '@puppeteer/browsers': 3.2.0
  brace-expansion: 5.0.9
  fast-uri@^3.0.0: 3.1.6
  fast-xml-parser@^5.0.0: 5.10.1
  ip-address: ^10.3.1
  # GHSA-8x5v-wxc8-hprp（high）：@wdio 链 deepmerge-ts <8.0.0 原型污染，v8 为官方补丁线
  deepmerge-ts: ^8.0.0
  # GHSA（moderate/low）：stylelint 链 colord 与 eslint-plugin-vue 链 selector parser
  colord: ^2.9.4
  postcss-selector-parser: ^7.1.3
  js-yaml@^4.0.0: 4.3.2
  # GHSA-2v37-7h3g-55p8：nanoid 自定义生成器在 size=0 时可死循环；v3（postcss 链）≥3.3.18
  nanoid@^3.0.0: 3.3.18
  nanoid@^5.0.0: 5.1.16
  postcss@^8.0.0: 8.5.23
  serialize-javascript: ^7.0.3
  undici: ^7.29.0
  vite: 6.4.3
patchedDependencies:
  minimatch@5.1.9: patches/minimatch@5.1.9.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
